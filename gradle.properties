# ---------------------------------------------------------------------------
# 字幕方块模组（SubtitleScreen / captionsmod）
#
# 【来源声明】初版由旧模型 v3.2 生成，面向 Minecraft 1.21.1 / Yarn 映射；
#            现依据《经验.md》升级至 Minecraft 26.3。详见 README。
# ---------------------------------------------------------------------------

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric（26.3 实测结论）
minecraft_version=26.3
loader_version=0.19.5

# 占位值：26.3 尚无官方 Yarn 映射，实际构建使用 gradle/identity-mappings.jar
# 查询方式：https://meta.fabricmc.net/v2/versions/yarn/26.3
yarn_mappings=26.3+build.1

# Fabric API（本环境以 libs/fabric-api-modules/ 本地模块 jar 提供）
fabric_api_version=0.161.0+26.3

# Mod Properties
mod_version=2.0.2
maven_group=com.subtitlescreen
archives_base_name=subtitlescreen
